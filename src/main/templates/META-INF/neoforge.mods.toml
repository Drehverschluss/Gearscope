modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Drehverschluss/Gearscope/issues"

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/Drehverschluss/Gearscope"
logoFile="gearscope.png"
logoBlur=false
authors="${mod_authors}"
credits="Attribute tooltip and value colors adapted from Apothic Attributes (Shadows_of_Fire, MIT); accessory slots built on the Accessories API (Wisp Forest, MIT)"
description="${mod_description}"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="accessories"
    type="optional"
    versionRange="[1.1.0-beta.54,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="apothic_attributes"
    type="optional"
    versionRange="[2.11.0,)"
    ordering="AFTER"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="mousetweaks"
    type="optional"
    versionRange="[2.26,)"
    ordering="AFTER"
    side="CLIENT"
[[dependencies.${mod_id}]]
    modId="inventorysorter"
    type="optional"
    versionRange="[24.0,)"
    ordering="AFTER"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="polymorph"
    type="optional"
    versionRange="[1.2.0,)"
    ordering="AFTER"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="jei"
    type="optional"
    versionRange="[19.70,)"
    ordering="AFTER"
    side="CLIENT"
[[dependencies.${mod_id}]]
    modId="sophisticatedbackpacks"
    type="optional"
    versionRange="[3.26,)"
    ordering="AFTER"
    side="CLIENT"
