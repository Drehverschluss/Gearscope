# Make CraftingMenu.slotChangedCraftingGrid public so GearscopeMenu can reuse the vanilla recipe
# lookup/result logic instead of reimplementing it. Polymorph mixes into this exact method, so routing
# through it keeps the crafting result compatible with Polymorph automatically.
public net.minecraft.world.inventory.CraftingMenu slotChangedCraftingGrid(Lnet/minecraft/world/inventory/AbstractContainerMenu;Lnet/minecraft/world/level/Level;Lnet/minecraft/world/entity/player/Player;Lnet/minecraft/world/inventory/CraftingContainer;Lnet/minecraft/world/inventory/ResultContainer;Lnet/minecraft/world/item/crafting/RecipeHolder;)V

# ArmorSlot is package-private in vanilla. Make the class public so GearscopeMenu can reuse it directly
# for the armor slots, getting identical placement rules (canEquip) and curse-of-binding handling as
# the vanilla player inventory, instead of duplicating that logic.
public net.minecraft.world.inventory.ArmorSlot

# Lets the attribute list render tooltips built from ClientTooltipComponents (e.g. Apothic's modifier lines
# with source icons). Apothic Attributes widens the same method; this makes it work without Apothic too.
public net.minecraft.client.gui.GuiGraphics renderTooltipInternal(Lnet/minecraft/client/gui/Font;Ljava/util/List;IILnet/minecraft/client/gui/screens/inventory/tooltip/ClientTooltipPositioner;)V
